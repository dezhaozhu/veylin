<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Veylin</title>
    <style>
      /* Match apps/web/src/index.css --background (:root / .dark) */
      html, body {
        margin: 0;
        background: oklch(1 0 0);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: oklch(1 0 0);
        color: oklch(0.141 0.005 285.823);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.45s ease;
      }
      #splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-mark-wrap {
        width: 168px;
        height: 148px;
        display: grid;
        place-items: center;
      }
      #splash .splash-mark {
        width: 140px;
        height: 110px;
        display: block;
        overflow: visible;
      }
      #splash .splash-logo {
        fill: url(#splash-grad-light);
        transform-origin: 116px 80px;
        animation: splash-phys-bounce 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      #splash .splash-ring {
        fill: none;
        stroke: url(#splash-ring-grad);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 60 180;
        transform-origin: 116px 80px;
        animation: splash-ring-spin 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #splash .splash-hint {
        font-size: 11px;
        color: oklch(0.552 0.016 285.938);
        min-height: 1em;
        text-align: center;
        max-width: 280px;
      }
      #splash .splash-hint:empty {
        display: none;
      }
      @keyframes splash-phys-bounce {
        0% { transform: scale(1) translateY(0); opacity: 0.85; }
        12% { transform: scale(1.04, 0.94) translateY(6px); opacity: 1; }
        30% { transform: scale(0.96, 1.04) translateY(-4px); }
        50% { transform: scale(1.01, 0.99) translateY(1px); }
        70%, 100% { transform: scale(1) translateY(0); opacity: 0.85; }
      }
      @keyframes splash-ring-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      /* App theme is class-based (.dark); keep splash in sync when that class appears */
      html.dark, html.dark body {
        background: oklch(0.141 0.005 285.823);
      }
      html.dark #splash {
        background: oklch(0.141 0.005 285.823);
        color: oklch(0.985 0 0);
      }
      html.dark #splash .splash-logo {
        fill: url(#splash-grad-dark);
      }
      html.dark #splash .splash-hint { color: oklch(0.705 0.015 286.067); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">

            <linearGradient id="splash-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1e293b" />
              <stop offset="60%" stop-color="#334155" />
              <stop offset="100%" stop-color="#3b82f6" />
            </linearGradient>
            <linearGradient id="splash-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="60%" stop-color="#cbd5e1" />
              <stop offset="100%" stop-color="#3b82f6" />
            </linearGradient>
            <linearGradient id="splash-ring-grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
            </linearGradient>

      </div>
